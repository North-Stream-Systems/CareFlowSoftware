<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="careflow-logo-title">
  <title id="careflow-logo-title">CareFlow</title>
  <defs>
    <linearGradient id="cf-mark-gradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1F3C" />
      <stop offset="1" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="cf-word-gradient" x1="88" y1="0" x2="176" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- Mark: rounded square with "Cf" monogram, navy-to-teal gradient -->
