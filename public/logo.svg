  <path
    d="M23.2 12.4c-4.9 0-8.5 3.6-8.5 8.4 0 4.8 3.5 8.3 8.3 8.3 2.1 0 3.9-.6 5.3-1.7l-1.8-2.6c-1 .8-2.1 1.2-3.4 1.2-2.9 0-5-2.1-5-5.2 0-3.1 2.1-5.3 5-5.3 1.2 0 2.3.4 3.2 1.1l1.8-2.6c-1.3-1-3-1.6-4.9-1.6z"
    fill="#F8FAFC"
  />
  <path d="M28.4 18.6h-4.9v2.8h4.4v-2.8z" fill="#F8FAFC" opacity="0.9" />

  <!-- Wordmark -->
  <text x="50" y="27" font-family="Outfit, Arial, sans-serif" font-weight="700" font-size="19" fill="#F8FAFC">Care</text>
  <text x="93" y="27" font-family="Outfit, Arial, sans-serif" font-weight="700" font-size="19" fill="url(#cf-word-gradient)">flow</text>
</svg>
